# Workspace: the CLI (this package, the root) plus the weave-docjson crate.
# `default-members` keeps plain `cargo build`/`cross build` on the CLI only.
[workspace]
members = [".", "docjson"]
default-members = ["."]

# Cross-repo deps come from GitHub, not sibling checkouts: a ticket worktree
# lives at <repo>/.tree/<ticket>, where a relative `../` path resolves to
# nothing. Declared once here so the CLI and docjson can never disagree about
# which wcl_lang they build against. Cargo.lock pins the commit;
# `cargo update -p <crate>` bumps it.
[workspace.dependencies]
wcl_lang = { git = "https://github.com/wiltaylor/wcl.git", branch = "main" }
wscript = { git = "https://github.com/Configweave/wscript.git", branch = "main" }
wscript-std = { git = "https://github.com/Configweave/wscript.git", branch = "main" }

[package]
name = "config-weave"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-binary configuration management driven by WCL playbooks and wscript scripts"

[dependencies]
wcl_lang = { workspace = true }
weave-docjson = { path = "docjson" }
wscript = { workspace = true }
wscript-std = { workspace = true }

clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
miette = { version = "7", features = ["fancy"] }
glob = "0.3"
tempfile = "3"
shell-words = "1"
ureq = "3"
sha2 = "0.11"
md-5 = "0.11"
argon2 = "0.5"
chacha20poly1305 = "0.11"
base64 = "0.23"
getrandom = "0.4"
zeroize = "1.9"
zip = { version = "8", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
tar = "0.4"
flate2 = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tera = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Services",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

# Workspace-level (cargo warns if these sit in a member package's manifest).
[profile.release]
strip = true
lto = "thin"
